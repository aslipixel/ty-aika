name: Build LetterPilot Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'letterpilot/index.html'
      - 'letterpilot/app.js'
      - 'letterpilot/style.css'
      - 'letterpilot-app/**'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: letterpilot-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: letterpilot-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: node build.mjs
      - run: npx cap add android
      - run: node android-prepare.mjs
        env:
          LP_BUILD_NUMBER: ${{ github.run_number }}
      - name: Build installable test APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LetterPilot.apk
          sha256sum LetterPilot.apk > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LetterPilot-Android-APK
          path: |
            letterpilot-app/LetterPilot.apk
            letterpilot-app/SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish APK to a permanent download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=letterpilot-android
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "LetterPilot для Android" \
              --notes "Свежая сборка LetterPilot для Android." --latest=false
          fi
          gh release upload "$TAG" LetterPilot.apk SHA256SUMS-Android.txt --clobber
          gh release edit "$TAG" --notes "Свежая сборка LetterPilot для Android (сборка №${{ github.run_number }}). Скачайте LetterPilot.apk и установите на телефон."
