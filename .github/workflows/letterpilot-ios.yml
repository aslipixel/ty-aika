name: Build LetterPilot IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['letterpilot/index.html', 'letterpilot-app/**', '.github/workflows/letterpilot-ios.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: letterpilot-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: letterpilot-app/package-lock.json
      - run: npm ci
      - run: node build.mjs
      - run: npx cap add ios --packagemanager SPM
      - run: node ios-prepare.mjs
      - name: Build for physical iPhone
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0 build
      - name: Package unsigned IPA for local signing
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          test -f Payload/App.app/public/index.html
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' Payload/App.app/Info.plist
          zip -qry LetterPilot.ipa Payload
          shasum -a 256 LetterPilot.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LetterPilot-iPhone-IPA
          path: |
            letterpilot-app/LetterPilot.ipa
            letterpilot-app/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
