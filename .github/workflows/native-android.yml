name: Build TuntiX Android Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', 'tuntix/tyontekija/**', '.github/workflows/native-android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: node --test tests/hours-navigation.test.cjs tests/calendar-multiple.test.cjs
      - run: node build.mjs && node --check www/app.js
      - run: npx cap add android
      - run: node android-prepare.mjs
        env:
          TUNTIX_BUILD_NUMBER: ${{ github.run_number }}
      - name: Build release APK for private signing
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Verify release package
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk tuntiX-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree tuntiX-unsigned.apk AndroidManifest.xml > manifest-check.txt
          if grep -q 'android:debuggable.*0xffffffff' manifest-check.txt; then exit 1; fi
          sha256sum tuntiX-unsigned.apk > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TuntiX-Android-APK
          path: |
            mobile/tuntiX-unsigned.apk
            mobile/SHA256SUMS-Android.txt
          if-no-files-found: error
      - name: Prepare portable Android Studio project
        run: |
          find android -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} +
          rm -f android/local.properties
          cp ANDROID-RU.md android/README-RU.md
          mkdir -p studio-project
          mv android studio-project/android
      - uses: actions/upload-artifact@v4
        with:
          name: TuntiX-Android-Studio
          path: mobile/studio-project/
          include-hidden-files: true
          if-no-files-found: error
