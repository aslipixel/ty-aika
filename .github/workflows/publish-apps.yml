name: Remove app downloads release
# One-time cleanup: deletes the public "apps" release and its tag. This file is removed right after.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-apps.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          if gh release view apps >/dev/null 2>&1; then gh release delete apps --cleanup-tag --yes; echo "Release apps deleted"; else echo "No apps release"; fi
          gh api "repos/$GH_REPO/git/refs/tags/apps" >/dev/null 2>&1 && gh api -X DELETE "repos/$GH_REPO/git/refs/tags/apps" && echo "Tag apps deleted" || echo "No apps tag"
