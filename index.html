<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Työaikakirjanpito</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--text:#1d1b3a;--muted:#6f6c8f;--line:#ebe7fb;--p:#7c5cff;--p2:#ff6fb1;--hg:linear-gradient(120deg,var(--p),var(--p2) 70%,#ffb86b);--shadow:0 8px 30px rgba(124,92,255,.14);
box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--card:#1f1c3d;--text:#f1efff;--muted:#a19ec7;--line:#322e5c;--shadow:0 8px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#14122b;--card:#1f1c3d;--text:#f1efff;--muted:#a19ec7;--line:#322e5c;--shadow:0 8px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
.hero{background:var(--hg);border-radius:0 0 22px 22px;color:#fff;padding:calc(max(env(safe-area-inset-top,0px),20px) + 22px) 14px 14px}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:center;align-items:center}
.top h1{margin:0;font-size:22px}
.logo{background:none;padding:0;display:flex;align-items:center;justify-content:center;flex:1;min-width:0}.logo img{width:100%;max-width:290px;height:auto;display:block}
.hero h1{margin:0;font-size:20px}.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
.nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:14px}
.nb{width:24px;height:34px;border:0;background:none;color:#fff;font-size:36px;font-weight:300;line-height:1;padding:0;cursor:pointer;flex:none}
.nb:active{transform:scale(.94)}
.range{text-align:right;margin-left:auto}
.range b{display:block;font-size:15px}
.range small{opacity:.9}
.main{position:relative;max-width:560px;margin:12px auto 24px;padding:0 14px}
.card{background:var(--card);border-radius:16px;padding:8px 11px;box-shadow:var(--shadow);margin-bottom:7px}
.week{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.week .t{font-size:20px;font-weight:800}
.week span{color:var(--muted);font-size:13px;display:block}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--p)}
.link{background:none;border:0;color:var(--p);font:inherit;font-weight:700;cursor:pointer;padding:2px 0}
.dh{display:flex;justify-content:space-between;align-items:center}
.dh b{font-size:15px}
.dh .tot{font-weight:800;font-size:16px;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card.today{outline:3px solid var(--p)}
.bar{height:6px;background:var(--line);border-radius:6px;margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:6px}
.en{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:5px 10px;margin-bottom:5px}
.en div{flex:1;min-width:0}.en b{display:block;font-weight:600;overflow-wrap:anywhere}.en small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{background:none;border:0;color:var(--muted);font-size:20px;padding:2px 8px;cursor:pointer}
.row{display:flex;gap:8px;margin-bottom:6px}.row>*{flex:1;min-width:0}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 2px 4px}
input[type=time],input[type=text]{width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text);font:inherit;font-size:16px;outline:none}
input:focus{border-color:var(--p)}
.btn{border:0;border-radius:12px;padding:8px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--p),var(--p2));cursor:pointer;width:100%}
.btn.g{background:var(--bg);color:var(--text);border:2px solid var(--line)}
.themeb{background:rgba(255,255,255,.25);color:#fff;border:0;border-radius:12px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;flex:none}

html:root[data-pal="cyber"]{--bg:#0a0612;--card:#150b27;--text:#e6fbff;--muted:#8fa8c8;--line:#2b1b4d;--p:#00f0ff;--p2:#ff2bd6;--hg:linear-gradient(120deg,#ff2bd6,#6d28d9 55%,#00d5ff);--shadow:0 0 16px rgba(0,240,255,.16)}
html:root[data-pal="cyber"]{color-scheme:dark}
html:root[data-pal="cyber"] body{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
html:root[data-pal="cyber"] .card{border:1px solid rgba(0,240,255,.4);box-shadow:0 0 14px rgba(0,240,255,.18),inset 0 0 14px rgba(255,43,214,.08)}
html:root[data-pal="cyber"] .hero{box-shadow:0 6px 26px rgba(255,43,214,.5)}
html:root[data-pal="cyber"] .hero h1{text-transform:uppercase;letter-spacing:2px;text-shadow:0 0 10px currentColor}
html:root[data-pal="cyber"] .btn{color:#05060a}
html:root[data-pal="cyber"] .btn.g{color:var(--text)}
.tw{position:relative;flex:none}
#pal{position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:190px;background:var(--card);color:var(--text);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:1px solid var(--line)}
#pal[hidden]{display:none}
#pal button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;cursor:pointer}
#pal button.on{background:var(--bg);font-weight:700}
#pal i{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
#pal hr{border:0;border-top:1px solid var(--line);margin:4px 0}

.ov{position:fixed;inset:0;background:rgba(10,8,30,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);color:var(--text);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font-size:18px}
.sheet .btn{margin-bottom:6px}
.btn.r{background:#e5384f;color:#fff}
html:root[data-pal="cyber"] .btn.r{color:#fff}
.st{font-size:12px;color:var(--muted);margin:6px 2px 10px}
</style>

<main class="main">
  <div class="card week">
    <div><div class="t" id="wt">0 ч</div><span>tällä viikolla</span></div>
    <div style="text-align:right">
      <label class="chk"><input type="checkbox" id="we"> Näytä la ja su</label>
      <button class="link" id="now" type="button">Tälle viikolle</button>
      
    </div>
  </div>
  <div id="days"></div>
</main>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const hm=s=>Math.floor(s/3600)+' h '+pad(Math.floor(s%3600/60))+' min';
let tomb=load('wt_tomb',[]),entries=load('wt_entries',[]),showWE=!!load('wt_weekend',false),goal=load('wt_goal',8),off=0,openDay=null,editId=null;
const NAMES=['Maanantai','Tiistai','Keskiviikko','Torstai','Perjantai','Lauantai','Sunnuntai'];
function monday(o){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d}
const fmt=d=>d.getDate()+'.'+(d.getMonth()+1)+'.';
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function render(){
  const m=monday(off),n=showWE?7:5,end=new Date(m);end.setDate(m.getDate()+n-1);
  $('rng').textContent=fmt(m)+' – '+fmt(end);
  $('wkn').textContent='Viikko '+isoWeek(m)+', '+m.getFullYear();
  $('we').checked=showWE;
  $('now').style.display=off===0?'none':'';
  const today=dkey(new Date());let total=0,html='';
  for(let i=0;i<n;i++){
    const d=new Date(m);d.setDate(m.getDate()+i);const k=dkey(d);
    const ed=editId?entries.find(x=>String(x.id)===String(editId)):null,es=entries.filter(e=>e.date===k),secs=es.reduce((a,e)=>a+e.secs,0);total+=secs;
    html+='<section class="card'+(k===today?' today':'')+'"><div class="dh"><b>'+NAMES[i]+', '+fmt(d)+'</b><span class="tot">'+(secs?hm(secs):'—')+'</span></div>'+
      (secs?'<div class="bar"><i style="width:'+Math.min(100,secs/(goal*3600)*100)+'%"></i></div>':'<div style="height:4px"></div>')+
      es.map(e=>'<div class="en"><div><b>'+esc(e.note||'Ei kuvausta')+'</b></div><button class="x" type="button" data-edit="'+e.id+'" aria-label="Muokkaa">✎</button><button class="x" type="button" data-del="'+e.id+'" aria-label="Poista">✕</button></div>').join('')+
      (openDay===k?
        '<div class="row"><div><label>Alkaa</label><input type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="07:00" class="tm" id="f_'+k+'" value="'+(ed&&ed.from||'')+'"></div><div><label>Päättyy</label><input type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="15:30" class="tm" id="t_'+k+'" value="'+(ed&&ed.to||'')+'"></div></div><div class="row"><div><label>Kuvaus (valinnainen)</label><input type="text" id="n_'+k+'" value="'+esc(ed?ed.note:'')+'"></div></div><div class="row"><button class="btn" type="button" data-save="'+k+'">'+(ed?'Tallenna muutokset':'Tallenna')+'</button><button class="btn g" type="button" data-open="">Peruuta</button></div>'
        :'<button class="btn g" type="button" data-open="'+k+'">＋ Lisää työaika</button>')+
      '</section>';
  }
  $('days').innerHTML=html;
  $('wt').textContent=hm(total);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='prev'){off--;openDay=null;render()}
  else if(t.id==='next'){off++;openDay=null;render()}
  else if(t.id==='now'){off=0;openDay=null;render()}
  else if(t.dataset.open!==undefined){openDay=t.dataset.open||null;editId=null;render()}
  else if(t.dataset.edit){const x=entries.find(y=>String(y.id)===t.dataset.edit);if(x){openDay=x.date;editId=x.id;render();const f=$('f_'+x.date);if(f)f.scrollIntoView({block:'center'})}}
  else if(t.dataset.save){
    const k=t.dataset.save,fi=$('f_'+k),ti=$('t_'+k),f=ptime(fi.value),to=ptime(ti.value);if(!f||!to){const bad=!f?fi:ti;bad.style.borderColor='#ff5c6c';bad.focus();return}
    const a=f.split(':'),b=to.split(':');let s=((+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]))*60;if(s<=0)s+=86400;
    const rec={date:k,secs:s,from:f,to:to,note:$('n_'+k).value,u:Date.now()};
    if(editId){entries=entries.map(x=>String(x.id)===String(editId)?{...x,...rec}:x)}else{entries.push({id:Date.now(),...rec})}
    saveAll();openDay=null;editId=null;render();
  }
  else if(t.dataset.del){askDel(t.dataset.del)}
});
function ptime(v){const d=String(v).replace(/\D/g,'');if(!d)return null;let h,m;if(d.length<=2){h=+d;m=0}else if(d.length===3){h=+d[0];m=+d.slice(1)}else{h=+d.slice(0,2);m=+d.slice(2,4)}return h<=23&&m<=59?pad(h)+':'+pad(m):null}
document.addEventListener('input',e=>{const el=e.target;if(!el.classList||!el.classList.contains('tm'))return;el.style.borderColor='';const d=el.value.replace(/\D/g,'').slice(0,4);el.value=d.length===3?d[0]+':'+d.slice(1):d.length===4?d.slice(0,2)+':'+d.slice(2):d});
$('we').onchange=e=>{showWE=e.target.checked;save('wt_weekend',showWE);render()};
const PALS=[['violet','Violetti','#7c5cff'],['cyber','Neon','#00f0ff']];
let pal=load('wt_pal','violet'),mode=load('wt_mode','light');
if(!['violet','cyber'].includes(pal)){pal='violet';save('wt_pal',pal)}
if(!['light','dark'].includes(mode)){mode='light';save('wt_mode',mode)}
function applyTheme(){const r=document.documentElement;r.dataset.pal=pal;r.dataset.theme=mode}
function drawPal(){$('pal').innerHTML=PALS.map(x=>'<button type="button" data-pal="'+x[0]+'" class="'+(x[0]===pal?'on':'')+'"><i style="background:'+x[2]+'"></i>'+x[1]+'</button>').join('')+'<hr>'+[['light','☀ Vaalea'],['dark','☾ Tumma']].map(x=>'<button type="button" data-mode="'+x[0]+'" class="'+(x[0]===mode?'on':'')+'">'+x[1]+'</button>').join('')+'<hr><button type="button" data-m="cloud">💾 Varmuuskopio</button>'}
$('theme').onclick=()=>{const o=$('pal').hidden;$('pal').hidden=!o;if(o)drawPal()};
$('pal').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.m){$('pal').hidden=true;modalCloud();return}if(b.dataset.pal){pal=b.dataset.pal;save('wt_pal',pal)}if(b.dataset.mode){mode=b.dataset.mode;save('wt_mode',mode)}applyTheme();drawPal()};
document.addEventListener('click',e=>{if(!e.target.closest('.tw'))$('pal').hidden=true});
let sx=null;
document.addEventListener('touchstart',e=>{sx=e.target.closest('input')?null:e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>90){off+=dx<0?1:-1;openDay=null;render()}},{passive:true});
/* ---------- tallennus ja yhdistäminen ---------- */
function saveAll(){save('wt_entries',entries);save('wt_tomb',tomb)}
function mergeData(a,b){
  const tm=new Map();[...(a.tomb||[]),...(b.tomb||[])].forEach(t=>{const o=tm.get(t.id);if(!o||t.u>o.u)tm.set(t.id,t)});
  const em=new Map();[...(a.entries||[]),...(b.entries||[])].forEach(e=>{const o=em.get(e.id);if(!o||(e.u||0)>(o.u||0))em.set(e.id,e)});
  const ents=[...em.values()].filter(e=>{const t=tm.get(e.id);return !(t&&t.u>=(e.u||0))});
  return {entries:ents,tomb:[...tm.values()].sort((x,y)=>y.u-x.u).slice(0,1000)};
}
/* ---------- modaalit ---------- */
function openModal(h){$('sheet').innerHTML=h;$('ov').classList.add('show')}
function closeModal(){$('ov').classList.remove('show')}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
function modalCloud(){
  openModal('<h2>💾 Varmuuskopio</h2><div class="st">Lataa varmuuskopio tiedostona ja tallenna se haluamaasi paikkaan, esimerkiksi iCloud Driveen tai Google Driveen. Palauta tiedot valitsemalla aiemmin tallennettu tiedosto.</div>'+
  '<div class="row"><button class="btn g" id="gdl" type="button">⬇ Lataa varmuuskopio</button><label class="btn g" style="text-align:center;margin:0;cursor:pointer">⬆ Palauta tiedostosta<input type="file" id="rfile" accept=".json,application/json" hidden></label></div>'+
  '<button class="btn g" id="mclose" type="button">Sulje</button>');
}
let delId=null;
function askDel(id){
  const x=entries.find(y=>String(y.id)===String(id));if(!x)return;delId=x.id;
  openModal('<h2>Poistetaanko merkintä?</h2><div class="st" style="font-size:15px;color:var(--text);margin-bottom:2px">'+esc(x.note||'Ei kuvausta')+'</div><div class="st">'+hm(x.secs)+' · Poistoa ei voi perua.</div><div class="row"><button class="btn g" id="delno" type="button">Peruuta</button><button class="btn r" id="delok" type="button">Poista</button></div>');
}
function doDel(){
  const x=entries.find(y=>y.id===delId);if(x)tomb.push({id:x.id,u:Date.now()});
  entries=entries.filter(y=>y.id!==delId);delId=null;saveAll();closeModal();render();
}
function dl(){
  const blob=new Blob([JSON.stringify({v:1,entries,tomb},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tyoaika-'+dkey(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}
document.addEventListener('change',e=>{
  if(e.target.id!=='rfile')return;const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.entries))throw 0;if(!confirm('Yhdistetäänkö tiedoston tiedot nykyisiin?'))return;const m=mergeData({entries,tomb},o);entries=m.entries;tomb=m.tomb;saveAll();closeModal();render()}catch(x){alert('Tiedostoa ei voitu lukea')}};r.readAsText(f);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const id=b.id;
  if(id==='mclose')closeModal();
  else if(id==='delno'){closeModal();delId=null}
  else if(id==='delok')doDel();
  else if(id==='gdl')dl();
});
applyTheme();render();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
