<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0d0f12;font-family:Inter,system-ui,sans-serif}
.sc{position:absolute;inset:0;overflow:hidden;opacity:0}
.sc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.8) 100%)}
.t{position:absolute;left:80px;right:80px;z-index:2;color:#fff;font-weight:900;letter-spacing:-.02em;line-height:1.02;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.big{font-size:118px}.mid{font-size:88px}
.t small{display:block;font-size:42px;font-weight:600;letter-spacing:0;margin-top:22px;color:#e8eef3}
.y{color:#ffd400}
.bar{display:inline-block;width:120px;height:12px;background:#ffd400;margin-bottom:34px}
#out{position:absolute;inset:0;background:#0d0f12;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}
#out h1{font-size:150px;font-weight:900;margin:0;letter-spacing:-.03em}
#out h2{font-size:56px;font-weight:700;margin:20px 0 0;color:#ffd400}
#out p{font-size:46px;font-weight:600;margin:70px 0 0;padding:26px 60px;border:5px solid #fff;border-radius:80px}
</style></head><body>
<div class="sc" id="s0"><img src="img/kaivo.jpg"><div class="t big" style="top:1180px"><span class="bar"></span><br>Katto<br><span class="y">vuotaa?</span></div></div>
<div class="sc" id="s1"><img src="img/tiimi.jpg"><div class="t mid" style="top:1220px"><span class="bar"></span><br>Bitumikermi&shy;katot <span class="y">ammattitaidolla.</span></div></div>
<div class="sc" id="s2"><img src="img/piha.jpg"><div class="t mid" style="top:1300px"><span class="bar"></span><br>Uudiskohteet<small>Pihakannet, vedeneristykset, kattoterassit</small></div></div>
<div class="sc" id="s3"><img src="img/katto.jpg"><div class="t mid" style="top:1300px"><span class="bar"></span><br>Korjaukset ja <span class="y">saneeraukset</span></div></div>
<div class="sc" id="s4"><img src="img/paikat.jpg"><div class="t mid" style="top:1300px"><span class="bar"></span><br>Huolellisesti <span class="y">jokainen yksityiskohta</span></div></div>
<div class="sc" id="s5" style="--d:1"><div style="position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.75) 75%)"></div><img src="img/ilma.jpg"><div class="t big" style="top:1100px"><span class="bar"></span><br>Tiivis.<br>Kestävä.<br><span class="y">Valmis.</span></div></div>
<div id="out"><span class="bar"></span><h1>Icopal Asl</h1><h2>Kattotyöt</h2><p>Pyydä tarjous</p></div>
<script>
const $=id=>document.getElementById(id),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>1-Math.pow(1-cl(x),3);
const S=[[0,3],[3,6],[6,9],[9,12],[12,15],[15,18]];
function setT(t){
  S.forEach(([a,b],i)=>{const el=$('s'+i);const o=Math.min(cl((t-a)/.25+ (i?0:4)),cl((b+.25-t)/.25));el.style.opacity=o;
    const p=(t-a)/(b-a+.25),img=el.querySelector('img');img.style.transform=`scale(${1.08+p*.1}) translate(${(i%2?-1:1)*p*20}px,${-p*20}px)`;
    const tx=el.querySelector('.t'),e=ease((t-a-.1)/.5);tx.style.opacity=e;tx.style.transform=`translateY(${(1-e)*60}px)`;
    el.querySelector('.bar').style.width=(120*ease((t-a)/.4))+'px'});
  const o=ease((t-18)/.4);$('out').style.opacity=o;$('out').style.transform=`scale(${1.05-o*.05})`;
}
window.ready=Promise.all([...document.images].map(i=>i.decode())).then(()=>document.fonts.ready);
</script></body></html>
