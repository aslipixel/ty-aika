applyTheme();
function applyTheme(){const theme=S.set.theme||'auto';if(theme==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=theme}
function settingsExtra(){return `<div class="card"><h3>Työmatka</h3><label for="office-address">Osoite A · lähtöosoite</label><input id="office-address" value="${esc(getOffice().address)}" placeholder="Katu, talonumero ja kaupunki" maxlength="300"><button class="btn" data-a="saveoffice">Tallenna osoite A</button><p id="office-status" role="status" style="font-size:12px"></p><p>Kilometrit näyttävät automatkan osoitteesta A projektiin, yhteen suuntaan. Reitti voi poiketa ajamastasi matkasta.</p><p style="font-size:11px">Osoitehaku: Photon · Reititys: OSRM · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>. Laskenta vaatii internetin ja lähettää lähtöosoitteen ja projektin osoitteen karttapalveluun.</p></div><div class="card"><h3>Ulkoasu</h3><label for="theme">Teema</label><select id="theme">${[['auto','Laitteen mukaan'],['light','Vaalea'],['dark','Tumma']].map(([v,n])=>`<option value="${v}" ${(S.set.theme||'auto')===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="card"><h3>Varmuuskopio ja vienti</h3><p>Tiedot säilyvät tässä selaimessa. Varmuuskopion avulla voit siirtää ne toiselle laitteelle.</p><button class="btn" data-a="backup">↓ Lataa varmuuskopio (JSON)</button><button class="btn" data-a="import">↑ Palauta varmuuskopio</button><input type="file" id="restore" accept=".json,application/json" hidden><button class="btn" data-a="csv">↓ Vie kaikki tunnit (CSV)</button></div>`}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function backup(){download('tuntix-'+dk(new Date())+'.json',JSON.stringify({app:'TuntiX',version:2,exportedAt:new Date().toISOString(),data:S},null,2),'application/json')}
function exportCsv(weekly){const start=dk(addD(mon(new Date()),wo*7)),end=dk(addD(pd(start),6));const entries=S.en.filter(e=>!weekly||(e.d>=start&&e.d<=end)).sort((a,b)=>a.d.localeCompare(b.d));const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';const rows=[['Päivä','Työlaji','Projekti','Tunnit','Kommentti'],...entries.map(e=>[e.d,e.t,pn(e.p),String(e.h).replace('.',','),e.c])];download('tuntix-'+(weekly?start:'kaikki')+'.csv','\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function validateBackup(raw){const x=raw.data||raw;const str=v=>typeof v==='string';const ids=a=>new Set(a.map(e=>e.id)).size===a.length;if(!x||!Array.isArray(x.en)||!Array.isArray(x.pr)||!x.set||!x.pf||!x.last||!Number.isFinite(x.set.goal)||x.set.goal<1||x.set.goal>24)throw Error();if(!x.pr.every(p=>str(p.id)&&/^[a-zA-Z0-9_-]+$/.test(p.id)&&str(p.n)&&str(p.a))||!ids(x.pr)||!ids(x.en))throw Error();const totals={};for(const e of x.en){if(!str(e.id)||!/^[a-zA-Z0-9_-]+$/.test(e.id)||!str(e.d)||!/^\d{4}-\d{2}-\d{2}$/.test(e.d)||isNaN(pd(e.d))||dk(pd(e.d))!==e.d||(!str(e.t)||!e.t.trim()||e.t.length>80)||!str(e.p)||!str(e.c)||!Number.isFinite(e.h)||e.h<0.5||e.h>24)throw Error();totals[e.d]=(totals[e.d]||0)+e.h;if(totals[e.d]>24)throw Error()}if(['customTypes','hiddenTypes'].some(k=>x.set[k]!==undefined&&(!Array.isArray(x.set[k])||x.set[k].length>200||!x.set[k].every(v=>str(v)&&v.trim()&&v.length<=80))))throw Error();if(x.set.office!==undefined&&!isOffice(x.set.office))throw Error();if(!['name','emp','role'].every(k=>str(x.pf[k])))throw Error();return {init:1,pr:x.pr.map(p=>({id:p.id,n:p.n,a:p.a,...(validDistance(p,getOffice(x.set))?{route:{...p.route}}:{})})),en:x.en.map(e=>({id:e.id,d:e.d,p:e.p,t:e.t,h:e.h,c:e.c})),set:{goal:x.set.goal,showWeekends:x.set.showWeekends===true,customTypes:[...(x.set.customTypes||[])],hiddenTypes:[...(x.set.hiddenTypes||[])],office:getOffice(x.set),theme:['light','dark','auto'].includes(x.set.theme)?x.set.theme:'auto'},pf:{name:x.pf.name,emp:x.pf.emp,role:x.pf.role},last:{t:allWorkTypes(x.set).some(t=>t[0]===x.last.t)&&!(x.set.hiddenTypes||[]).includes(x.last.t)?x.last.t:(allWorkTypes(x.set).find(t=>!(x.set.hiddenTypes||[]).includes(t[0]))||['Laskutyö'])[0],p:x.pr.some(p=>p.id===x.last.p)?x.last.p:''}}}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;switch(b.dataset.a){case 'backup':backup();break;case 'csv':exportCsv(false);break;case 'weekcsv':exportCsv(true);break;case 'import':$('#restore').click();break;case 'now':wo=0;mo=0;render();break}});
document.addEventListener('change',async ev=>{const t=ev.target;if(t.id==='theme'){S.set.theme=t.value;save();applyTheme()}if(t.id==='weekdate'&&t.value){wo=Math.round((mon(pd(t.value))-mon(new Date()))/604800000);const d=pd(t.value),now=new Date();mo=(d.getFullYear()-now.getFullYear())*12+d.getMonth()-now.getMonth();render(1)}if(t.id==='restore'&&t.files[0]){try{if(t.files[0].size>5000000)throw Error();const next=validateBackup(JSON.parse(await t.files[0].text()));if(!confirm('Korvataanko nykyiset tiedot varmuuskopiolla? Nykyisistä tiedoista ladataan ensin kopio.'))return;backup();const previous=S;S=next;if(!save()){S=previous;return}applyTheme();render(1);toast('Varmuuskopio palautettu')}catch(e){toast('Virheellinen varmuuskopio. Tietoja ei muutettu.')}finally{t.value=''}}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){$('#m').innerHTML='';ed=null}if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.row[data-a]')){ev.preventDefault();ev.target.click()}});
const observer=new MutationObserver(()=>{document.querySelectorAll('.row[data-a]').forEach(el=>{el.tabIndex=0;el.setAttribute('role','button')});document.querySelectorAll('label').forEach(el=>{const next=el.nextElementSibling;if(next&&/^(INPUT|SELECT)$/.test(next.tagName)){if(!next.id)next.id='field-'+Math.random().toString(36).slice(2);el.htmlFor=next.id}})});observer.observe($('#app'),{childList:true,subtree:true});observer.observe($('#m'),{childList:true,subtree:true});
// Office coordinates verified with Photon / OpenStreetMap for Jaakonkatu 2, 01620 Vantaa.
const OFFICE={address:'Jaakonkatu 2, 01620 Vantaa',point:[24.851418,60.2847221]};
const routeJobs=new Map();let routeQueue=Promise.resolve();
const addressKey=a=>String(a||'').toLocaleLowerCase('fi').replace(/[^a-z0-9äöå]/g,'');
function validDistance(p,origin=getOffice()){const r=p?.route;return !!(r&&r.office===origin.address&&addressKey(r.address)===addressKey(p.a)&&Number.isFinite(r.km)&&r.km>=0&&r.km<5000&&typeof r.label==='string'&&typeof r.checkedAt==='string')}
function distanceBadge(id){const p=S.pr.find(p=>p.id===id);if(!p?.a)return '';return `<span class="km" data-distance="${esc(id)}" aria-live="polite">${distanceText(p)}</span>`}
function distanceText(p){if(validDistance(p))return `<span title="${esc(getOffice().address+' → '+p.route.label+' · Auto, yhteen suuntaan')}">· ${p.route.km.toLocaleString('fi-FI',{minimumFractionDigits:1,maximumFractionDigits:1})} km</span>`;const state=routeJobs.get(routeJobKey(p));if(state?.error)return `<button type="button" data-a="retrykm" data-id="${esc(p.id)}" title="${esc(state.error)}">km: ${esc(state.error==='Tarkista katu, talonumero ja kaupunki'?'tarkista osoite':'yritä uudelleen')}</button>`;return '· km…'}
function paintDistances(){document.querySelectorAll('[data-distance]').forEach(el=>{const p=S.pr.find(p=>p.id===el.dataset.distance);el.innerHTML=p?.a?distanceText(p):''})}
function refreshDistances(){document.querySelectorAll('[data-distance]').forEach(el=>{const p=S.pr.find(p=>p.id===el.dataset.distance);if(p?.a&&!validDistance(p))queueDistance(p)});paintDistances()}
async function mapJson(url){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(url,{signal:controller.signal,credentials:'omit'});if(!r.ok)throw Error('Karttapalvelu ei vastaa');return await r.json()}finally{clearTimeout(timer)}}
function addressCandidates(features,query){const key=addressKey(query),found=new Map();for(const f of features||[]){const p=f.properties||{},point=f.geometry?.coordinates;const street=p.street,number=p.housenumber,city=p.city||p.town||p.village;if(p.countrycode!=='FI'||!street||!number||!city||!Array.isArray(point)||point.length!==2||!point.every(Number.isFinite))continue;const house=query.match(/(?:^|\s)(\d+[a-zA-Z]?)(?=\s|,|$)/)?.[1];const postal=query.match(/(?:^|\s)(\d{5})(?=\s|,|$)/)?.[1];if(!house||addressKey(house)!==addressKey(number)||(postal&&postal!==p.postcode))continue;const expected=addressKey(street+' '+number);if(!key.includes(expected)||!key.includes(addressKey(city)))continue;const label=street+' '+number+', '+(p.postcode?p.postcode+' ':'')+city;const id=addressKey(label);if(!found.has(id))found.set(id,{label,point})}return [...found.values()]}
async function calculateDistance(address,origin=getOffice()){const data=await mapJson('https://photon.komoot.io/api/?q='+encodeURIComponent(address)+'&limit=8');const matches=addressCandidates(data.features,address);if(matches.length!==1)throw Error('Tarkista katu, talonumero ja kaupunki');const target=matches[0];const path=origin.point.join(',')+';'+target.point.join(',');const data2=await mapJson('https://router.project-osrm.org/route/v1/driving/'+path+'?overview=false&alternatives=false&steps=false');const route=data2.routes?.[0];if(data2.code!=='Ok'||!Number.isFinite(route?.distance)||route.distance<0||data2.waypoints?.length!==2||data2.waypoints.some(p=>!Number.isFinite(p.distance)||p.distance>250))throw Error('Ajoreittiä ei löytynyt');return {office:origin.address,address,km:route.distance/1000,label:target.label,checkedAt:new Date().toISOString()}}
function queueDistance(p){const address=p.a,origin=getOffice(),key=routeJobKey(p,origin);if(routeJobs.has(key))return;const state={};routeJobs.set(key,state);routeQueue=routeQueue.then(async()=>{if(!S.pr.includes(p)||p.a!==address||getOffice().address!==origin.address)return;try{const result=await calculateDistance(address,origin);if(S.pr.includes(p)&&p.a===address&&getOffice().address===origin.address){p.route=result;save()}}catch(error){state.error=error.message==='Tarkista katu, talonumero ja kaupunki'?error.message:'Laskenta ei onnistunut'}finally{paintDistances();await new Promise(r=>setTimeout(r,1100))}}).catch(()=>{state.error='Laskenta ei onnistunut';paintDistances()})}
document.addEventListener('change',ev=>{if(ev.target.id==='work-type'&&ed){sync();ed.t=ev.target.value;if(ABS.includes(ed.t))ed.h=S.set.goal;sheet()}if(ev.target.id==='fp'&&ed){sync();sheet()}});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a="retrykm"]');if(!b)return;const p=S.pr.find(p=>p.id===b.dataset.id);if(p){routeJobs.delete(routeJobKey(p));queueDistance(p);paintDistances()}});

function isOffice(o){return !!(o&&typeof o.address==='string'&&o.address.trim()&&o.address.length<=300&&Array.isArray(o.point)&&o.point.length===2&&o.point.every(Number.isFinite)&&Math.abs(o.point[0])<=180&&Math.abs(o.point[1])<=90)}
function getOffice(settings=S.set){const o=settings?.office;return isOffice(o)?{address:o.address,point:[...o.point]}:OFFICE}
function routeJobKey(p,origin=getOffice()){return origin.address+'|'+p.id+'|'+addressKey(p.a)}
let officeSaving=false;
async function saveOfficeAddress(button){if(officeSaving)return;const input=$('#office-address'),status=$('#office-status'),address=input.value.trim();if(!address){status.textContent='Anna katu, talonumero ja kaupunki';return}if(address===getOffice().address){status.textContent='Osoite A on jo tallennettu';return}officeSaving=true;button.disabled=true;status.textContent='Tarkistetaan osoitetta…';try{let origin;if(addressKey(address)===addressKey(OFFICE.address)){origin=OFFICE}else{const data=await mapJson('https://photon.komoot.io/api/?q='+encodeURIComponent(address)+'&limit=8');const matches=addressCandidates(data.features,address);if(matches.length!==1)throw Error('Osoitetta ei tunnistettu. Tarkista katu, talonumero ja kaupunki.');origin={address:matches[0].label,point:matches[0].point}}if(!input.isConnected||input.value.trim()!==address){status.textContent='Osoite muuttui. Paina Tallenna uudelleen.';return}const previous=S.set.office;S.set.office=origin;if(!save()){if(previous===undefined)delete S.set.office;else S.set.office=previous;status.textContent='Tallennus epäonnistui';return}input.value=origin.address;status.textContent='Osoite A tallennettu. Kilometrit päivittyvät projektin yhteydessä.';refreshDistances()}catch(error){status.textContent=error.message.startsWith('Osoitetta')?error.message:'Osoitteen tarkistus epäonnistui. Yritä uudelleen.'}finally{officeSaving=false;button.disabled=false}}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a="saveoffice"]');if(b)saveOfficeAddress(b)});

let formViewportFrame=0;
function focusedFieldScroll(rect,sheetRect,viewportTop,viewportHeight){const top=Math.max(sheetRect.top,viewportTop)+24;const bottom=Math.min(sheetRect.bottom,viewportTop+viewportHeight)-96;const room=bottom-top;if(room<=0)return rect.top-top;if(rect.bottom>bottom||rect.top<top)return rect.top-(top+Math.max(0,(room-rect.height)/2));return 0}
function updateFormViewport(){formViewportFrame=0;const viewport=window.visualViewport;const top=viewport?.offsetTop||0,height=viewport?.height||window.innerHeight;document.documentElement.style.setProperty('--visible-top',top+'px');document.documentElement.style.setProperty('--visible-height',height+'px');const field=document.activeElement;if(!field?.matches('input,textarea,select'))return;const sheet=field.closest('.sheet');if(!sheet)return;const delta=focusedFieldScroll(field.getBoundingClientRect(),sheet.getBoundingClientRect(),top,height);if(Math.abs(delta)>1)sheet.scrollTop+=delta}
function scheduleFormViewport(){if(!formViewportFrame)formViewportFrame=requestAnimationFrame(updateFormViewport)}
window.visualViewport?.addEventListener('resize',scheduleFormViewport);
window.visualViewport?.addEventListener('scroll',scheduleFormViewport);
window.addEventListener('resize',scheduleFormViewport);
document.addEventListener('focusin',ev=>{if(!ev.target.closest('.sheet'))return;scheduleFormViewport();setTimeout(scheduleFormViewport,150);setTimeout(scheduleFormViewport,400)});
document.addEventListener('focusout',()=>setTimeout(scheduleFormViewport,400));
scheduleFormViewport();

render();

function measureNavigation(){const nav=document.getElementById('nav');if(nav){const height=Math.ceil(nav.getBoundingClientRect().height);if(height>0)document.documentElement.style.setProperty('--nav-height',height+'px')}}
const navigationResizeObserver=typeof ResizeObserver!=='undefined'?new ResizeObserver(measureNavigation):null;
navigationResizeObserver?.observe(document.getElementById('nav'));
window.addEventListener('resize',measureNavigation);
requestAnimationFrame(measureNavigation);

</script>
